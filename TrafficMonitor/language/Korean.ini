IDS_HARDWARE_MONITOR_WARNING = "경고: 하드웨어 모니터링 기능을 활성화하려고 합니다. 하드웨어 모니터링 기능을 사용하면 온도 및 GPU 사용량 정보를 표시할 수 있습니다. 이 기능을 활성화하기 전에 다음 내용을 주의 깊게 읽어 주십시오:r\nTrafficMonitor는 전문적인 하드웨어 모니터링 소프트웨어가 아닙니다. 모든 컴퓨터에서 하드웨어 정보를 가져올 수 있다고 보장할 수 없으며, 획득한 하드웨어 정보의 정확성 또한 보장할 수 없습니다.\r\n하드웨어 모니터링 기능은 외부 라이브러리인 'LibreHardwareMonitor'를 통해 구현됩니다. 하드웨어 모니터링을 활성화할 경우, 일부 컴퓨터에서 다음과 같은 문제들이 발생할 수 있습니다(단, 이에 국한되지는 않습니다):\r\n* 비정상적인 CPU 및 메모리 사용량\r\n* 프로그램 충돌\r\n* 컴퓨터 먹통\r\n위와 같은 위험 사항을 인지하신 후, 하드웨어 모니터링 기능을 활성화할지 여부를 결정해 주시기 바랍니다. \r\n정말로 하드웨어 모니터링 기능을 켜시겠습니까?"
